# Render blueprint: one free web service that runs the kitchen and serves the game app.
# Secrets are marked `sync: false`, so Render asks for them in its dashboard; none live in this repo.
services:
  - type: web
    name: ownling
    runtime: node
    plan: free
    buildCommand: npm ci --prefix kitchen && npm ci --include=dev --prefix app && npm run build --prefix app
    startCommand: cd kitchen && node src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: STATIC_DIR
        value: ../app/dist
      - key: PETS_CONTRACT
        value: pets.ownling.testnet
      - key: KITCHEN_ACCOUNT_ID
        value: kitchen.ownling.testnet
      - key: SPONSOR_ACCOUNT_ID
        value: ownling.testnet
      - key: KITCHEN_SESSION_SECRET
        generateValue: true
      - key: NEAR_AI_API_KEY
        sync: false
      - key: KITCHEN_PRIVATE_KEY
        sync: false
      - key: SPONSOR_PRIVATE_KEY
        sync: false
      # 1 = practice mode (canned replies, no NEAR AI). Clear it once the NEAR AI credit is active.
      - key: KITCHEN_MOCK
        sync: false
