<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mochi is hibernating</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D63D8}a:hover{color:#1E4BB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #ECEAE6; color: #1F2230; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 28px; font-weight: 900; letter-spacing: -0.02em">Mochi</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5B6072"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5D6475"></span>Hibernating · Child</div>
</div>
<a href="Screen-07-Diary.dc.html" aria-label="Mochi's diary" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E4DFD6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></a>
</div>

<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<dc-import name="Mochi" stage="child" mood="{{mood}}" moment="{{moment}}" size="270" hint-size="270px,270px"></dc-import>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4DFD6; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 18px; font-weight: 800">{{title}}</div>
<div style="height: 12px; border-radius: 999px; background: #E9EBEF; overflow: hidden"><div style="width: {{bar}}; height: 100%; border-radius: 999px; background: #2D63D8"></div></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6072">{{body}}</p>
</div>

<button onClick="{{wake}}" style="height: 56px; border-radius: 999px; border: none; background: #2D63D8; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer">{{cta}}</button>
<p style="margin: 0; font-size: 13px; color: #5B6072; text-align: center">Wake up feeds <span style="font-family: 'JetBrains Mono', monospace; color: #1F2230">0.1 testnet NEAR</span> to Mochi's food budget.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const awake = this.state && this.state.awake;
    return {
      mood: awake ? 'peckish' : 'hibernating',
      moment: awake ? 'waking' : 'none',
      title: awake ? 'Mochi can think for 5 more days' : "Mochi can't afford a thought",
      bar: awake ? '17%' : '0%',
      body: awake ? 'Awake again, with every memory it had.' : 'Nothing is lost. Its memory, growth and personality are kept while it sleeps. Feeding wakes it.',
      cta: awake ? 'Awake' : 'Wake up',
      wake: () => this.setState({ awake: !awake })
    };
  }
}
</script>
</body>
</html>
