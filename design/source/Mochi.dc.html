<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mochi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes mochiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mochiBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}}
@keyframes mochiDot{0%,100%{opacity:.3}50%{opacity:1}}
.m-float{animation:mochiFloat 3.6s ease-in-out infinite}
.m-bounce{animation:mochiBounce 1.1s ease-in-out infinite}
.m-dot1{animation:mochiDot 1.2s ease-in-out infinite}
.m-dot2{animation:mochiDot 1.2s ease-in-out .2s infinite}
.m-dot3{animation:mochiDot 1.2s ease-in-out .4s infinite}
@media (prefers-reduced-motion: reduce){.m-float,.m-bounce,.m-dot1,.m-dot2,.m-dot3{animation:none}}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; display: block; position: relative">
<svg viewBox="0 0 200 200" width="100%" height="100%" style="overflow: visible; display: block" role="img" aria-label="{{label}}">
<defs>
<radialGradient id="mochiLive" gradientUnits="userSpaceOnUse" cx="86" cy="74" r="132">
<stop offset="0.42" stop-color="#FFFFFF"></stop>
<stop offset="1" stop-color="#D3DEF6"></stop>
</radialGradient>
<radialGradient id="mochiPale" gradientUnits="userSpaceOnUse" cx="86" cy="74" r="132">
<stop offset="0.42" stop-color="#F4F5F8"></stop>
<stop offset="1" stop-color="#CBD2E0"></stop>
</radialGradient>
<radialGradient id="mochiGrey" gradientUnits="userSpaceOnUse" cx="86" cy="74" r="132">
<stop offset="0.3" stop-color="#E2E5EB"></stop>
<stop offset="1" stop-color="#B3B9C6"></stop>
</radialGradient>
<radialGradient id="mochiEgg" gradientUnits="userSpaceOnUse" cx="88" cy="96" r="90">
<stop offset="0.3" stop-color="#FFFFFF"></stop>
<stop offset="1" stop-color="#CFDDF8"></stop>
</radialGradient>
</defs>
<ellipse cx="100" cy="182" rx="{{shadowRx}}" ry="7" fill="#2B3145" opacity="0.12"></ellipse>
<g class="{{motion}}">
<g transform="translate(100 176) scale({{sx}} {{sy}}) translate(-100 -176)">

<g display="{{showEgg}}">
<path d="M100 66 C128 66 142 110 142 132 C142 158 123 172 100 172 C77 172 58 158 58 132 C58 110 72 66 100 66 Z" fill="{{eggFill}}" stroke="{{outline}}" stroke-width="4"></path>
<path d="M62 124 C72 114 82 130 92 120 C102 110 112 128 122 118 C130 110 136 118 139 122" fill="none" stroke="{{wisp}}" stroke-width="4" stroke-linecap="round"></path>
<path d="M106 82 L101 92 L108 98 L103 106" fill="none" stroke="{{outline}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" display="{{showCrack}}"></path>
<ellipse cx="84" cy="92" rx="7" ry="11" fill="#FFFFFF" opacity="0.8" transform="rotate(20 84 92)"></ellipse>
</g>

<g display="{{showCloud}}">
<circle cx="{{c0.x}}" cy="{{c0.y}}" r="{{c0.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c1.x}}" cy="{{c1.y}}" r="{{c1.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c2.x}}" cy="{{c2.y}}" r="{{c2.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c3.x}}" cy="{{c3.y}}" r="{{c3.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c4.x}}" cy="{{c4.y}}" r="{{c4.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c5.x}}" cy="{{c5.y}}" r="{{c5.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c6.x}}" cy="{{c6.y}}" r="{{c6.r}}" fill="{{outline}}" stroke="{{outline}}" stroke-width="8"></circle>
<circle cx="{{c0.x}}" cy="{{c0.y}}" r="{{c0.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c1.x}}" cy="{{c1.y}}" r="{{c1.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c2.x}}" cy="{{c2.y}}" r="{{c2.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c3.x}}" cy="{{c3.y}}" r="{{c3.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c4.x}}" cy="{{c4.y}}" r="{{c4.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c5.x}}" cy="{{c5.y}}" r="{{c5.r}}" fill="{{bodyFill}}"></circle>
<circle cx="{{c6.x}}" cy="{{c6.y}}" r="{{c6.r}}" fill="{{bodyFill}}"></circle>
<path d="M112 42 C109 30 122 24 129 31 C134 36 128 43 122 39" fill="none" stroke="{{outline}}" stroke-width="4" stroke-linecap="round" display="{{showTuft}}"></path>
<path d="M88 34 C92 26 100 24 104 30" fill="none" stroke="{{outline}}" stroke-width="3.4" stroke-linecap="round" display="{{showCrest}}"></path>
<path d="M110 28 C114 22 122 22 124 28" fill="none" stroke="{{outline}}" stroke-width="3.4" stroke-linecap="round" display="{{showCrest}}"></path>
</g>

<g display="{{showFace}}" transform="translate({{fx}} {{fy}}) scale({{fs}})">
<g display="{{showCheeks}}">
<ellipse cx="-27" cy="7" rx="7.5" ry="4.2" fill="#F4A3AE" opacity="0.9"></ellipse>
<ellipse cx="27" cy="7" rx="7.5" ry="4.2" fill="#F4A3AE" opacity="0.9"></ellipse>
</g>
<g display="{{eOpen}}">
<ellipse cx="{{eyeL}}" cy="{{eyeY}}" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="{{ink}}"></ellipse>
<ellipse cx="{{eyeR}}" cy="{{eyeY}}" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="{{ink}}"></ellipse>
<circle cx="{{hlL}}" cy="{{hlY}}" r="2.1" fill="#FFFFFF"></circle>
<circle cx="{{hlR}}" cy="{{hlY}}" r="2.1" fill="#FFFFFF"></circle>
</g>
<path display="{{eHappy}}" d="M-23 -2 Q-16 -11 -9 -2 M9 -2 Q16 -11 23 -2" fill="none" stroke="{{ink}}" stroke-width="3.4" stroke-linecap="round"></path>
<g display="{{eSleepy}}">
<path d="M-23 -3 A7 6 0 0 0 -9 -3 Z" fill="{{ink}}"></path>
<path d="M9 -3 A7 6 0 0 0 23 -3 Z" fill="{{ink}}"></path>
<path d="M-25 -3 L-7 -3 M7 -3 L25 -3" stroke="{{ink}}" stroke-width="3" stroke-linecap="round"></path>
</g>
<path display="{{eAsleep}}" d="M-23 -4 Q-16 3 -9 -4 M9 -4 Q16 3 23 -4" fill="none" stroke="{{ink}}" stroke-width="3" stroke-linecap="round"></path>
<path display="{{mSmile}}" d="M-6 9 Q0 15 6 9" fill="none" stroke="{{ink}}" stroke-width="2.8" stroke-linecap="round"></path>
<g display="{{mOpen}}">
<ellipse cx="0" cy="11" rx="5" ry="4.6" fill="{{ink}}"></ellipse>
<ellipse cx="0" cy="13.2" rx="3" ry="1.8" fill="#E8737F"></ellipse>
</g>
<circle display="{{mO}}" cx="0" cy="11" r="2.7" fill="{{ink}}"></circle>
<path display="{{mWobble}}" d="M-7 12 Q-3.5 8.5 0 12 Q3.5 15.5 7 12" fill="none" stroke="{{ink}}" stroke-width="2.6" stroke-linecap="round"></path>
<g display="{{mBig}}">
<ellipse cx="0" cy="12" rx="7" ry="6.6" fill="{{ink}}"></ellipse>
<ellipse cx="0" cy="15.4" rx="4.2" ry="2.4" fill="#E8737F"></ellipse>
</g>
</g>

<g display="{{showThink}}" transform="translate({{thinkX}} {{thinkY}})">
<circle cx="-12" cy="20" r="3.5" fill="#FFFFFF" stroke="#2B3145" stroke-width="2.4"></circle>
<ellipse cx="12" cy="-4" rx="24" ry="15" fill="#FFFFFF" stroke="#2B3145" stroke-width="3"></ellipse>
<circle class="m-dot1" cx="2" cy="-4" r="3.2" fill="#2B3145"></circle>
<circle class="m-dot2" cx="12" cy="-4" r="3.2" fill="#2B3145"></circle>
<circle class="m-dot3" cx="22" cy="-4" r="3.2" fill="#2B3145"></circle>
</g>

<g display="{{showZ}}" transform="translate({{zX}} {{zY}})">
<path d="M0 0 H11 L0 13 H11" fill="none" stroke="#7E8597" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M16 -18 H24 L16 -8 H24" fill="none" stroke="#7E8597" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
</g>

<g display="{{showEat}}" transform="translate({{eatX}} {{eatY}}) scale(0.8)">
<path d="M0 -14 C7 -5 10 1 10 6 A10 10 0 0 1 -10 6 C-10 1 -7 -5 0 -14 Z" fill="#6AA6F2" stroke="#2B3145" stroke-width="2.6"></path>
<ellipse cx="-3" cy="3" rx="2.2" ry="3.4" fill="#FFFFFF" opacity="0.85"></ellipse>
</g>

<g display="{{showHint}}" transform="translate({{hintX}} {{hintY}}) scale(0.7)">
<path d="M0 -14 C7 -5 10 1 10 6 A10 10 0 0 1 -10 6 C-10 1 -7 -5 0 -14 Z" fill="#6AA6F2" stroke="#2B3145" stroke-width="2.6"></path>
<ellipse cx="-3" cy="3" rx="2.2" ry="3.4" fill="#FFFFFF" opacity="0.85"></ellipse>
</g>

<g display="{{showSpark}}">
<path transform="translate({{sp1X}} {{sp1Y}})" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z" fill="#F2B33D" stroke="#2B3145" stroke-width="1.8" stroke-linejoin="round"></path>
<path transform="translate({{sp2X}} {{sp2Y}}) scale(0.7)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z" fill="#F2B33D" stroke="#2B3145" stroke-width="2.2" stroke-linejoin="round"></path>
<path transform="translate({{sp3X}} {{sp3Y}}) scale(0.55)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z" fill="#F2B33D" stroke="#2B3145" stroke-width="2.6" stroke-linejoin="round"></path>
</g>

<g display="{{showSweat}}" transform="translate({{sweatX}} {{sweatY}}) scale(0.55)">
<path d="M0 -14 C7 -5 10 1 10 6 A10 10 0 0 1 -10 6 C-10 1 -7 -5 0 -14 Z" fill="#CFE2FB" stroke="#2B3145" stroke-width="3"></path>
</g>

<g display="{{showBadge}}" transform="translate({{badgeX}} {{badgeY}})">
<circle cx="0" cy="0" r="13" fill="#1A6B48" stroke="#FFFFFF" stroke-width="3"></circle>
<path d="M-6 0 L-1.5 4.5 L6.5 -4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</g>

<g display="{{showBow}}" transform="translate({{bowX}} {{bowY}})">
<path d="M0 0 C-6 -12 -22 -12 -20 -2 C-19 6 -8 6 0 0 Z" fill="#F4A3AE" stroke="#2B3145" stroke-width="2.6" stroke-linejoin="round"></path>
<path d="M0 0 C6 -12 22 -12 20 -2 C19 6 8 6 0 0 Z" fill="#F4A3AE" stroke="#2B3145" stroke-width="2.6" stroke-linejoin="round"></path>
<circle cx="0" cy="0" r="4.5" fill="#E8737F" stroke="#2B3145" stroke-width="2.4"></circle>
</g>

<g display="{{showSlots}}">
<ellipse cx="{{hatX}}" cy="{{hatY}}" rx="24" ry="13" fill="none" stroke="#2D63D8" stroke-width="2" stroke-dasharray="5 4"></ellipse>
<text x="{{hatX}}" y="{{hatLabelY}}" text-anchor="middle" font-size="10" font-weight="700" fill="#2D63D8" font-family="JetBrains Mono, monospace">hat</text>
<rect x="{{scarfX}}" y="{{scarfY}}" width="72" height="14" rx="7" fill="none" stroke="#2D63D8" stroke-width="2" stroke-dasharray="5 4"></rect>
<text x="{{scarfLabelX}}" y="{{scarfLabelY}}" text-anchor="start" font-size="10" font-weight="700" fill="#2D63D8" font-family="JetBrains Mono, monospace">scarf</text>
<circle cx="{{itemX}}" cy="{{itemY}}" r="13" fill="none" stroke="#2D63D8" stroke-width="2" stroke-dasharray="5 4"></circle>
<text x="{{itemX}}" y="{{itemLabelY}}" text-anchor="middle" font-size="10" font-weight="700" fill="#2D63D8" font-family="JetBrains Mono, monospace">item</text>
</g>

</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["egg","baby","child","teen","adult"],"default":"child"},"mood":{"editor":"enum","options":["content","peckish","hungry","hibernating"],"default":"content"},"moment":{"editor":"enum","options":["none","thinking","talking","eating","playing","resting","verified","waking","gifting"],"default":"none"},"size":{"editor":"int","min":24,"max":800,"default":320},"slots":{"editor":"boolean","default":false},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = this.props.stage ?? 'child';
    const mood = this.props.mood ?? 'content';
    const moment = this.props.moment ?? 'none';
    const size = Number(this.props.size ?? 320);
    const slots = this.props.slots === true || this.props.slots === 'true';
    const C = (x, y, r) => ({ x: x, y: y, r: r });
    const Z = C(100, 120, 0);
    const ST = {
      egg: { c: [], top: 66, left: 58, right: 142, fx: 100, fy: 128, fs: 0.9, sh: 36 },
      baby: { c: [C(100, 132, 36), C(82, 112, 20), C(116, 106, 22)], top: 84, left: 64, right: 136, fx: 100, fy: 136, fs: 0.78, sh: 36 },
      child: { c: [C(100, 124, 46), C(66, 134, 28), C(134, 134, 28), C(82, 94, 28), C(118, 88, 30)], top: 58, left: 38, right: 162, fx: 100, fy: 128, fs: 1, sh: 54 },
      teen: { c: [C(100, 120, 50), C(60, 132, 32), C(140, 132, 32), C(76, 90, 30), C(112, 76, 34), C(146, 100, 22)], top: 42, left: 28, right: 172, fx: 100, fy: 124, fs: 1.05, sh: 62 },
      adult: { c: [C(100, 122, 52), C(54, 134, 32), C(146, 134, 32), C(66, 94, 32), C(104, 70, 38), C(140, 90, 32), C(100, 148, 28)], top: 32, left: 22, right: 178, fx: 100, fy: 120, fs: 1.12, sh: 72 }
    };
    const s = ST[stage] || ST.child;
    const c = [];
    for (let i = 0; i < 7; i++) c.push(s.c[i] || Z);
    const hib = mood === 'hibernating';
    const egg = stage === 'egg';
    let eyes = 'open', mouth = 'smile';
    if (mood === 'peckish') { eyes = 'side'; mouth = 'o'; }
    if (mood === 'hungry') { eyes = 'sleepy'; mouth = 'wobble'; }
    if (hib) { eyes = 'asleep'; mouth = 'none'; }
    if (!hib) {
      const M = { thinking: ['up', 'o'], talking: ['open', 'open'], eating: ['happy', 'big'], playing: ['happy', 'open'], resting: ['sleepy', 'smile'], verified: ['open', 'smile'], waking: ['wide', 'o'], gifting: ['happy', 'smile'] }[moment];
      if (M) { eyes = M[0]; mouth = M[1]; }
    }
    const show = (b) => (b ? 'inline' : 'none');
    let eyeRx = 5.6, eyeRy = 7.2, px = 0, py = 0;
    if (eyes === 'wide') { eyeRx = 6.6; eyeRy = 8.6; }
    if (eyes === 'side') { px = 3.2; }
    if (eyes === 'up') { px = 2; py = -3; }
    let sx = 1, sy = 1;
    if (mood === 'hungry') { sx = 0.9; sy = 0.84; }
    if (hib) { sx = 0.94; sy = 0.88; }
    let motion = 'm-float';
    if (hib || mood === 'hungry' || moment === 'eating' || moment === 'resting') motion = '';
    if (moment === 'playing' && !hib && !egg) motion = 'm-bounce';
    const outline = hib ? '#7E8597' : '#2B3145';
    const bodyFill = hib ? 'url(#mochiGrey)' : (mood === 'hungry' ? 'url(#mochiPale)' : 'url(#mochiLive)');
    const fs = s.fs;
    return {
      size: size,
      label: 'Mochi, ' + stage + ', ' + mood + (moment !== 'none' ? ', ' + moment : ''),
      shadowRx: s.sh * sx,
      motion: motion, sx: sx, sy: sy,
      outline: outline, bodyFill: bodyFill,
      eggFill: hib ? 'url(#mochiGrey)' : 'url(#mochiEgg)',
      wisp: hib ? '#9AA1B0' : '#8DB4F2',
      showEgg: show(egg), showCrack: show(egg && !hib && (moment === 'talking' || moment === 'waking')),
      showCloud: show(!egg),
      showTuft: show(stage === 'teen'), showCrest: show(stage === 'adult'),
      c0: c[0], c1: c[1], c2: c[2], c3: c[3], c4: c[4], c5: c[5], c6: c[6],
      showFace: show(!egg), fx: s.fx, fy: s.fy, fs: fs,
      ink: hib ? '#5D6475' : '#2B3145',
      showCheeks: show(!hib && mood !== 'hungry'),
      eOpen: show(eyes === 'open' || eyes === 'wide' || eyes === 'side' || eyes === 'up'),
      eHappy: show(eyes === 'happy'), eSleepy: show(eyes === 'sleepy'), eAsleep: show(eyes === 'asleep'),
      eyeL: -16 + px, eyeR: 16 + px, eyeY: -4 + py, eyeRx: eyeRx, eyeRy: eyeRy,
      hlL: -14 + px, hlR: 18 + px, hlY: -7 + py,
      mSmile: show(mouth === 'smile'), mOpen: show(mouth === 'open'), mO: show(mouth === 'o'), mWobble: show(mouth === 'wobble'), mBig: show(mouth === 'big'),
      showThink: show(!hib && !egg && moment === 'thinking'), thinkX: Math.min(s.right - 6, 158), thinkY: s.top - 10,
      showZ: show(hib), zX: Math.min(s.right - 18, 150), zY: s.top - 2,
      showEat: show(!hib && !egg && moment === 'eating'), eatX: s.fx + 13 * fs, eatY: s.fy + 4 * fs,
      showHint: show(!hib && !egg && mood === 'peckish' && moment === 'none'), hintX: Math.min(s.right + 16, 190), hintY: s.fy + 14,
      showSpark: show(!hib && (moment === 'playing' || moment === 'waking')),
      sp1X: s.left + 2, sp1Y: s.top + 14, sp2X: s.right - 4, sp2Y: s.top + 2, sp3X: Math.min(s.right + 8, 188), sp3Y: s.fy + 22,
      showSweat: show(!hib && !egg && moment === 'resting'), sweatX: s.fx + 30 * fs, sweatY: s.fy - 26 * fs,
      showBadge: show(moment === 'verified'), badgeX: s.right - 10, badgeY: s.top + 22,
      showBow: show(!egg && moment === 'gifting'), bowX: s.fx + 20, bowY: s.top + 6,
      showSlots: show(slots && !egg),
      hatX: s.fx + 4, hatY: s.top - 4, hatLabelY: s.top - 22,
      scarfX: s.fx - 36, scarfY: s.fy + 26 * fs, scarfLabelX: s.fx + 40, scarfLabelY: s.fy + 26 * fs + 11,
      itemX: s.left + 4, itemY: s.fy + 30, itemLabelY: s.fy + 56
    };
  }
}
</script>
</body>
</html>
