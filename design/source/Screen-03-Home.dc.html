<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mochi home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D63D8}a:hover{color:#1E4BB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; background: #F5F2EC; color: #1F2230; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 28px; font-weight: 900; letter-spacing: -0.02em">Mochi</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5B6072"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1A6B48"></span>Content · Child</div>
</div>
<div style="display: flex; gap: 8px">
<a href="Screen-07-Diary.dc.html" aria-label="Mochi's diary" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E4DFD6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></a>
<a href="Screen-08-Ownership.dc.html" aria-label="Who controls Mochi" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E4DFD6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></a>
</div>
</div>

<div style="align-self: flex-start; max-width: 270px; background: #FFFFFF; border: 1px solid #E4DFD6; border-radius: 20px 20px 20px 6px; padding: 12px 14px; font-size: 16px; line-height: 1.45">{{line}}</div>

<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<dc-import name="Mochi" stage="child" mood="content" moment="{{moment}}" size="270" hint-size="270px,270px"></dc-import>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4DFD6; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 18px; font-weight: 800">Mochi can think for 23 more days</div>
</div>
<div style="height: 12px; border-radius: 999px; background: #E3ECFD; overflow: hidden"><div style="width: 77%; height: 100%; border-radius: 999px; background: #2D63D8"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B6072">
<span>Growth 34 · teen at 75</span>
<span style="font-family: 'JetBrains Mono', monospace">0.46 testnet NEAR</span>
</div>
<div style="font-size: 12px; color: #5B6072">Counted at the full daily cap. Light chatting lasts longer.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<a href="Screen-05-Feed.dc.html" style="height: 64px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4DFD6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1F2230; text-decoration: none; font-size: 15px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D63D8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"></path></svg>Feed</a>
<button onClick="{{play}}" style="height: 64px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4DFD6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1F2230; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D63D8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"></path></svg>{{playLabel}}</button>
<a href="Screen-04-Chat.dc.html" style="height: 64px; border-radius: 20px; background: #2D63D8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>Talk</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (this.state && this.state.play) || 0;
    const moment = st === 1 ? 'playing' : (st === 2 ? 'resting' : 'none');
    const line = st === 1 ? '*bounces* Again. Again.' : (st === 2 ? '*flops down* Tired. Ten minutes?' : '*floats closer* You came back.');
    return {
      moment: moment,
      line: line,
      playLabel: st === 2 ? 'Rest 9:58' : 'Play',
      play: () => this.setState({ play: st === 0 ? 1 : (st === 1 ? 2 : 0) })
    };
  }
}
</script>
</body>
</html>
